name: iosApp
options:
  bundleIdPrefix: com.pace
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.app
        PRODUCT_NAME: Pace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        SWIFT_STRICT_CONCURRENCY: minimal
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../shared/build/XCFrameworks/release"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/shared.xcframework
        embed: true
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    archive:
      config: Release
