name: iosApp
options:
  bundleIdPrefix: com.pace
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: iosApp/Pace.entitlements
    GENERATE_INFOPLIST_FILE: "NO"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    settings:
      # 调试构建要认得 `#if DEBUG`：故障注入那一整块只在这里面编译，
      # 正式包里连编都不编进去。
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pace.app
        PRODUCT_NAME: Pace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
        SWIFT_STRICT_CONCURRENCY: minimal
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../shared/build/XCFrameworks/release"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/shared.xcframework
        embed: true
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    archive:
      config: Release
