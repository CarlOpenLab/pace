name: android

on:
  push:
    branches: [main, "feat/**", "docs/**", "fix/**"]
  pull_request:

jobs:
  build:
    name: tests & debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Shared core unit tests (budget / money / import / fingerprint)
        run: ./gradlew :shared:testDebugUnitTest --console=plain

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pace-android-debug-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
