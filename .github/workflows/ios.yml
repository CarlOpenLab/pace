name: ios

on:
  push:
    branches: [main, "feat/**", "docs/**", "fix/**"]
  pull_request:

jobs:
  build:
    name: shared framework & unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (KMP android target needs it to configure)
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/pace-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Build shared XCFramework (release)
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --console=plain

      - name: Select newest Xcode
        run: |
          set -euxo pipefail
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive (unsigned, device)
        run: |
          set -euxo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Pack unsigned IPA
        run: |
          set -euxo pipefail
          mkdir -p build/Payload
          cp -R "build/iosApp.xcarchive/Products/Applications/Pace.app" build/Payload/
          cd build && zip -qry Pace-unsigned.ipa Payload

      - name: Build simulator app
        run: |
          set -euxo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          cd build/dd/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/build/Pace-simulator-app.zip" Pace.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios-unsigned-ipa
          path: build/Pace-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios-simulator-app
          path: build/Pace-simulator-app.zip
          if-no-files-found: error
          retention-days: 14

  type-scale:
    name: 字号跟系统走（不许写死）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 写死的字号与 minimumScaleFactor 必须为 0 处
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          # Colo 第十五版 §5 的两条：
          # 一，`.font(.system(size: <数字字面量>` 一处都不许有——字号要跟着系统走。
          #    白名单写法是 `.font(.system(size: 某个 ScaledMetric 变量, …))`，那不是字面量。
          # 二，`minimumScaleFactor` 一处都不许有——它把用户选的字号压回去。
          #
          # 注释里提到这两种写法是允许的（代码里正在解释为什么禁它们），所以逐行只看代码部分。
          hardcoded = re.compile(r"\.font\(\.system\(size:\s*[0-9]")
          shrink = re.compile(r"minimumScaleFactor")

          bad = []
          for path in sorted(pathlib.Path("iosApp").rglob("*.swift")):
              for no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  code = line.split("//", 1)[0]
                  if not code.strip():
                      continue
                  if hardcoded.search(code):
                      bad.append((path, no, "写死的字号", line.strip()))
                  if shrink.search(code):
                      bad.append((path, no, "minimumScaleFactor", line.strip()))

          for path, no, why, text in bad:
              print(f"::error file={path},line={no}::{why}：{text}")

          if bad:
              print(f"\n共 {len(bad)} 处。字号请走 PaceType 的角色或 paceFont(base, …)；"
                    "放不下就改布局，不许缩字。")
              sys.exit(1)
          print("写死的字号 0 处，minimumScaleFactor 0 处。")
          PY
