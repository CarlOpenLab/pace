name: ios

on:
  push:
    branches: [main, "feat/**", "docs/**", "fix/**"]
  pull_request:

jobs:
  build:
    name: shared framework & unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (KMP android target needs it to configure)
        run: |
          set -euxo pipefail
          export ANDROID_HOME="$HOME/pace-android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Build shared XCFramework
        run: ./gradlew :shared:assembleSharedXCFramework --console=plain

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Archive (unsigned, device)
        run: |
          set -euxo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Pack unsigned IPA
        run: |
          set -euxo pipefail
          mkdir -p build/Payload
          cp -R "build/iosApp.xcarchive/Products/Applications/Pace.app" build/Payload/
          cd build && zip -qry Pace-unsigned.ipa Payload

      - name: Build simulator app
        run: |
          set -euxo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          cd build/dd/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/build/Pace-simulator-app.zip" Pace.app

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios-unsigned-ipa
          path: build/Pace-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: pace-ios-simulator-app
          path: build/Pace-simulator-app.zip
          if-no-files-found: error
          retention-days: 14
