name: web

on:
  push:
    branches: [main, "feat/**", "docs/**", "fix/**"]
  pull_request:

jobs:
  build:
    name: lint / test / build (web prototype)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check & build (includes tsc --noEmit)
        run: npm run build

      - name: Unit tests
        run: npm test
